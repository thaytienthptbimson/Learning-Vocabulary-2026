        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; display: none; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); text-align: center; margin-bottom: 20px; }
        select, input { width: 100%; padding: 10px; font-size: 15px; border: 2px solid #bdc3c7; border-radius: 8px; background-color: #ecf0f1; font-weight: bold; color: #2c3e50; box-sizing: border-box; margin-bottom: 15px;}
        select:focus, input:focus { outline: none; border-color: #3498db; }
        .content-area { min-height: 160px; display: flex; flex-direction: column; justify-content: center; margin-bottom: 20px; padding: 20px; background: #fdfdfd; border-radius: 10px; border: 1px dashed #ccc; text-align: left; }
        .word-group { text-align: center; }
        .word { font-size: 38px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .ipa { font-size: 22px; color: #e67e22; font-family: 'Times New Roman', Times, serif; margin-bottom: 10px; }
        .meaning { font-size: 20px; color: #7f8c8d; text-align: center; margin-bottom: 15px; }
        .example { font-size: 15px; color: #34495e; font-style: italic; background: #ebf5fb; padding: 10px; border-radius: 6px; border-left: 4px solid #3498db; display: none; }
        button { padding: 12px 15px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin: 5px; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        button:hover { opacity: 0.85; }
        .btn-listen { background-color: #27ae60; color: white; width: 45%; }
        .btn-speak { background-color: #2980b9; color: white; width: 45%; }
        .btn-next { background-color: #8e44ad; color: white; margin-top: 15px; width: 100%; }
        .btn-toggle-teacher { background-color: #34495e; color: white; width: 100%; margin-top: 10px;}
        #result { margin-top: 15px; font-weight: bold; font-size: 16px; min-height: 40px; text-align: center; }
        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; }
        .teacher-area { background: #fff3cd; padding: 20px; border-radius: 15px; border: 2px solid #ffe69c; display: none; text-align: left; }
        .teacher-area h3 { margin-top: 0; color: #856404; text-align: center; }
        .form-group { margin-bottom: 10px; }
        .btn-add { background-color: #d35400; color: white; width: 100%; margin-top: 10px; }
        #lockScreen { display: none; width: 100%; max-width: 500px; margin-top: 50px; }
        .lock-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); text-align: center; border-top: 5px solid #c0392b; }
        .lock-card h2 { color: #c0392b; margin-top: 0; }
        .btn-unlock { background-color: #c0392b; color: white; width: 100%; margin-top: 10px; }
        #trialNotice { text-align: center; color: #d35400; font-size: 14px; font-weight: bold; margin-top: 15px; }
    </style>
</head>

<div id="lockScreen">
    <div class="lock-card">
        <h2>🔒 HẾT HẠN DÙNG THỬ</h2>
        <p style="color: #7f8c8d; font-size: 15px; margin-bottom: 20px;">Thời gian dùng thử 30 ngày của bạn đã kết thúc. Vui lòng nhập mật khẩu để mở khóa phần mềm vĩnh viễn.</p>
        <input type="password" id="passwordInput" placeholder="Nhập mật khẩu bản quyền...">
        <button class="btn-unlock" onclick="checkPassword()">🔓 Mở Khóa Phần Mềm</button>
        <p id="lockErrorMsg" style="color: #c0392b; font-weight: bold; margin-top: 15px; font-size: 14px;"></p>
    </div>
</div>

<div class="container" id="appScreen">
    <div class="card">
        <select id="topicSelect" onchange="changeTopic()"></select>
        
        <div class="content-area">
            <div class="word-group">
                <div class="word" id="wordDisplay">Loading...</div>
                <div class="ipa" id="ipaDisplay">/.../</div>
                <div class="meaning" id="meaningDisplay">Đang tải dữ liệu...</div>
            </div>
            <div class="example" id="exampleDisplay"></div>
        </div>
        
        <div>
            <button class="btn-listen" onclick="listenWord()">🔊 Nghe</button>
            <button class="btn-speak" onclick="speakWord()">🎙 Đọc</button>
        </div>
        
        <p id="result"></p>
        
        <button class="btn-next" onclick="nextWord()">⏭️ Chuyển từ</button>
        <p id="counterDisplay" style="color: #95a5a6; font-size: 14px; text-align: center;"></p>
    </div>

    <button class="btn-toggle-teacher" onclick="toggleTeacherArea()">👨‍🏫 Bật/Tắt Chế độ Giáo viên (Thêm từ lẻ)</button>
    <div class="teacher-area" id="teacherArea">

        <p id="saveMsg" style="color: #27ae60; text-align: center; font-weight: bold; font-size: 14px;"></p>
    </div>

    <p id="trialNotice"></p>
</div>

    function checkLicense() {
        const isUnlocked = localStorage.getItem('vocabApp_Unlocked');
        if (isUnlocked === 'true') {
            showApp();
            return;
        }

        let trialStart = localStorage.getItem('vocabApp_TrialStart');
        if (!trialStart) {
            trialStart = Date.now();
            localStorage.setItem('vocabApp_TrialStart', trialStart);
        }

        const msPassed = Date.now() - parseInt(trialStart);
        const daysPassed = Math.floor(msPassed / (1000 * 60 * 60 * 24));
        const daysLeft = TRIAL_DAYS - daysPassed;

        if (daysLeft > 0) {
            showApp();
            document.getElementById("trialNotice").innerText = `⏳ Bạn còn ${daysLeft} ngày dùng thử miễn phí.`;
        } else {
            document.getElementById("appScreen").style.display = "none";
            document.getElementById("lockScreen").style.display = "block";
        }
    }

    function checkPassword() {
        const input = document.getElementById("passwordInput").value;
        if (input === SECRET_PASSWORD) {
            localStorage.setItem('vocabApp_Unlocked', 'true');
            document.getElementById("lockScreen").style.display = "none";

      "word": "soulmate",
      "ipa": "/ˈsoʊl.meɪt/",
      "meaning": "bạn tri kỷ, người tâm giao",
      "example": "I truly believe my wife is my soulmate."
    }
  ]
};

    function initAppLogic() {
        vocabData = JSON.parse(JSON.stringify(VOCAB_DATA));
        
        const savedData = localStorage.getItem('teacherVocab_AllInOne');
        if (savedData) {
            const parsedSaved = JSON.parse(savedData);
            for (const topic in parsedSaved) {
                if (!vocabData[topic]) vocabData[topic] = [];
                vocabData[topic] = vocabData[topic].concat(parsedSaved[topic]);
            }
        }
        
        const topicSelect = document.getElementById("topicSelect");
        topicSelect.innerHTML = ""; 
        const topicNames = Object.keys(vocabData);

        if (topicNames.length === 0) {
            topicSelect.innerHTML = "<option value=''>Chưa có từ vựng</option>";
            vocabList = [];
        } else {
            topicNames.forEach(topic => {
                const option = document.createElement("option");
                option.value = topic;
                option.innerText = topic;
                topicSelect.appendChild(option);
            });
            changeTopic(); 
        }
    }

    function changeTopic() {
        currentTopic = document.getElementById("topicSelect").value;
        document.getElementById("newTopic").value = currentTopic; 
        vocabList = vocabData[currentTopic] || [];
        currentIndex = 0;
        updateWordDisplay();
    }

    function updateWordDisplay() {
        const resultDisplay = document.getElementById("result");
        resultDisplay.innerText = "";

        if (vocabList.length === 0) {
            document.getElementById("wordDisplay").innerText = "Chưa có từ";
            document.getElementById("ipaDisplay").innerText = "";
            document.getElementById("meaningDisplay").innerText = "Chủ đề này đang trống. Bạn có thể mở file JSON để thêm dữ liệu.";
            document.getElementById("exampleDisplay").style.display = "none";
            document.getElementById("counterDisplay").innerText = "";
            return;
        }

        const data = vocabList[currentIndex];
        document.getElementById("wordDisplay").innerText = data.word;
        document.getElementById("ipaDisplay").innerText = data.ipa;
        document.getElementById("meaningDisplay").innerText = data.meaning;
        
        const exampleDisplay = document.getElementById("exampleDisplay");
        if (data.example) {
            exampleDisplay.style.display = "block";
            exampleDisplay.innerHTML = "💡 <b>Ví dụ:</b> " + data.example;
        } else {
            exampleDisplay.style.display = "none";
            exampleDisplay.innerHTML = "";
        }

        document.getElementById("counterDisplay").innerText = `Từ ${currentIndex + 1} / ${vocabList.length}`;
    }

    function nextWord() {
        if (vocabList.length > 0) {
            currentIndex = (currentIndex + 1) % vocabList.length;
            updateWordDisplay();
        }
    }

    function listenWord() {
        if (vocabList.length === 0) return;
        const utterance = new SpeechSynthesisUtterance(vocabList[currentIndex].word);
        utterance.lang = 'en-US'; 
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
    }

    function speakWord() {
        if (vocabList.length === 0) return;
        const resultDisplay = document.getElementById("result");
        resultDisplay.innerText = "Đang nghe... (Nói vào micro)";
        resultDisplay.style.color = "#2980b9";

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            resultDisplay.innerText = "Trình duyệt không hỗ trợ. Hãy dùng Google Chrome!";
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.start();

        recognition.onresult = function(event) {
            const spokenWord = event.results[0][0].transcript.toLowerCase().trim().replace(/[^a-z\s]/g, '');
            const targetWord = vocabList[currentIndex].word.toLowerCase().trim().replace(/[^a-z\s]/g, '');

            if (spokenWord === targetWord) {
                resultDisplay.innerHTML = "🎉 Chính xác!";
                resultDisplay.className = "correct";
            } else {
                resultDisplay.innerHTML = `Chưa đúng. Bạn đọc là: "<b>${event.results[0][0].transcript}</b>"`;
                resultDisplay.className = "incorrect";
            }
        };
    }

    function toggleTeacherArea() {
        const area = document.getElementById("teacherArea");
        area.style.display = area.style.display === "none" || area.style.display === "" ? "block" : "none";
    }

    function addNewWord() {
        const topic = document.getElementById("newTopic").value.trim();
        const word = document.getElementById("newWord").value.trim();
        const ipa = document.getElementById("newIpa").value.trim();
        const meaning = document.getElementById("newMeaning").value.trim();

        if (!topic || !word || !meaning) {
            alert("Vui lòng điền đầy đủ Chủ đề, Từ tiếng Anh và Nghĩa!");
            return;
        }

        let savedData = JSON.parse(localStorage.getItem('teacherVocab_AllInOne') || '{}');
        if (!savedData[topic]) savedData[topic] = [];
        savedData[topic].push({ word, ipa, meaning, example: "" }); 
        localStorage.setItem('teacherVocab_AllInOne', JSON.stringify(savedData));

        document.getElementById("saveMsg").innerText = "✔ Đã thêm từ vựng thành công!";
        document.getElementById("newWord").value = "";
        document.getElementById("newIpa").value = "";
        document.getElementById("newMeaning").value = "";
        setTimeout(() => document.getElementById("saveMsg").innerText = "", 3000);

        initAppLogic();
        document.getElementById("topicSelect").value = topic; 
        changeTopic();
    }

    window.onload = checkLicense;
</script>
