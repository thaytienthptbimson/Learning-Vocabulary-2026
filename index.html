<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Từ vựng & Phát âm</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f4f8;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        /* Cố định chiều cao cho khu vực hiển thị từ vựng để giao diện không bị giật khi đổi từ */
        .content-area {
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            margin-bottom: 25px;
            background-color: #ecf0f1;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
        }
        select:focus {
            outline: none;
            border-color: #3498db;
        }

        .word {
            font-size: 40px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .ipa {
            font-size: 22px;
            color: #e67e22; /* Màu cam nổi bật cho IPA */
            font-family: 'Times New Roman', Times, serif;
            margin-bottom: 10px;
        }
        .meaning {
            font-size: 20px;
            color: #7f8c8d;
        }
        
        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.1s, opacity 0.3s;
        }
        button:active { transform: scale(0.95); }
        button:hover { opacity: 0.85; }
        
        .btn-listen { background-color: #27ae60; color: white; }
        .btn-speak { background-color: #2980b9; color: white; }
        .btn-next { background-color: #8e44ad; color: white; margin-top: 20px; width: 100%; }
        
        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
            min-height: 40px;
        }
        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; }
        .listening { color: #2980b9; font-style: italic; }
        
        /* Hiển thị số đếm từ */
        .counter {
            font-size: 14px;
            color: #95a5a6;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Menu chọn chủ điểm -->
    <select id="topicSelect" onchange="changeTopic()"></select>
    
    <div class="content-area">
        <div class="word" id="wordDisplay">Loading...</div>
        <!-- Thêm thẻ hiển thị IPA -->
        <div class="ipa" id="ipaDisplay">/.../</div>
        <div class="meaning" id="meaningDisplay">Đang tải...</div>
    </div>
    
    <div>
        <button class="btn-listen" onclick="listenWord()">🔊 Nghe mẫu</button>
        <button class="btn-speak" onclick="speakWord()">🎙️ Đọc thử</button>
    </div>
    
    <p id="result"></p>
    
    <button class="btn-next" onclick="nextWord()">⏭️ Chuyển từ tiếp theo</button>
    
    <div class="counter" id="counterDisplay">Từ 1 / 5</div>
</div>

<script>
    // NGÂN HÀNG DỮ LIỆU: Cấu trúc theo Chủ điểm -> Danh sách từ vựng (Có IPA)
    // Giáo viên có thể copy/paste thêm hàng trăm từ vào đây
    const vocabData = {
        "Unit 1: School Life (Trường học)": [
            { word: "Education", ipa: "/ˌedʒuˈkeɪʃn/", meaning: "Giáo dục" },
            { word: "Knowledge", ipa: "/ˈnɒlɪdʒ/", meaning: "Kiến thức" },
            { word: "Assignment", ipa: "/əˈsaɪnmənt/", meaning: "Bài tập về nhà" },
            { word: "Schedule", ipa: "/ˈʃedjuːl/", meaning: "Thời khóa biểu" }
        ],
        "Unit 2: The Environment (Môi trường)": [
            { word: "Environment", ipa: "/ɪnˈvaɪrənmənt/", meaning: "Môi trường" },
            { word: "Pollution", ipa: "/pəˈluːʃn/", meaning: "Sự ô nhiễm" },
            { word: "Recycle", ipa: "/ˌriːˈsaɪkl/", meaning: "Tái chế" },
            { word: "Protect", ipa: "/prəˈtekt/", meaning: "Bảo vệ" }
        ],
        "Unit 3: Family (Gia đình)": [
            { word: "Generation", ipa: "/ˌdʒenəˈreɪʃn/", meaning: "Thế hệ" },
            { word: "Sibling", ipa: "/ˈsɪblɪŋ/", meaning: "Anh chị em ruột" },
            { word: "Relative", ipa: "/ˈrelətɪv/", meaning: "Họ hàng" }
        ]
    };

    let currentTopic = "";
    let vocabList = [];
    let currentIndex = 0;

    // Hàm khởi tạo trang web
    function initApp() {
        const selectElement = document.getElementById("topicSelect");
        
        // Nạp các chủ điểm vào menu thả xuống
        for (const topic in vocabData) {
            const option = document.createElement("option");
            option.value = topic;
            option.innerText = topic;
            selectElement.appendChild(option);
        }

        // Đặt chủ điểm mặc định là chủ điểm đầu tiên
        currentTopic = selectElement.value;
        vocabList = vocabData[currentTopic];
        
        loadWord();
    }

    // Hàm chạy khi học sinh chọn chủ điểm khác
    function changeTopic() {
        currentTopic = document.getElementById("topicSelect").value;
        vocabList = vocabData[currentTopic]; // Lấy danh sách từ của chủ điểm mới
        currentIndex = 0; // Quay về từ đầu tiên
        loadWord();
    }

    // Tải từ vựng, IPA và Nghĩa lên giao diện
    function loadWord() {
        const currentWordData = vocabList[currentIndex];
        
        document.getElementById("wordDisplay").innerText = currentWordData.word;
        document.getElementById("ipaDisplay").innerText = currentWordData.ipa;
        document.getElementById("meaningDisplay").innerText = currentWordData.meaning;
        document.getElementById("result").innerText = "";
        
        // Cập nhật bộ đếm
        document.getElementById("counterDisplay").innerText = `Từ ${currentIndex + 1} / ${vocabList.length}`;
    }

    // Tính năng đọc phát âm mẫu
    function listenWord() {
        const word = vocabList[currentIndex].word;
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US'; 
        utterance.rate = 0.85; // Đọc chậm rãi để dễ nghe IPA
        window.speechSynthesis.speak(utterance);
    }

    // Tính năng ghi âm và chấm điểm
    function speakWord() {
        const resultDisplay = document.getElementById("result");
        resultDisplay.innerText = "Đang nghe... (Hãy nói vào micro)";
        resultDisplay.className = "listening";

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            resultDisplay.innerText = "Trình duyệt không hỗ trợ micro. Vui lòng dùng Google Chrome!";
            resultDisplay.className = "incorrect";
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.start();

        recognition.onresult = function(event) {
            const spokenWord = event.results[0][0].transcript.toLowerCase().trim().replace(/[^a-z\s]/g, '');
            const targetWord = vocabList[currentIndex].word.toLowerCase().trim().replace(/[^a-z\s]/g, '');

            if (spokenWord === targetWord) {
                resultDisplay.innerText = "🎉 Chính xác!";
                resultDisplay.className = "correct";
            } else {
                resultDisplay.innerText = `Chưa đúng. Bạn vừa đọc là: "${event.results[0][0].transcript}"`;
                resultDisplay.className = "incorrect";
            }
        };

        recognition.onerror = function() {
            resultDisplay.innerText = "Không nghe rõ tiếng, hãy bấm nút và thử lại!";
            resultDisplay.className = "incorrect";
        };
    }

    // Chuyển sang từ tiếp theo
    function nextWord() {
        currentIndex = (currentIndex + 1) % vocabList.length;
        loadWord();
    }

    // Khởi động ứng dụng ngay khi tải xong trang
    window.onload = initApp;
</script>

</body>
</html>
